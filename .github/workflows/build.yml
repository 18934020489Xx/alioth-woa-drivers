name: Build ARM64 drivers

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WDK + SDK (NuGet)
        shell: pwsh
        run: |
          $v = '10.0.26100.2454'
          nuget install Microsoft.Windows.SDK.CPP.arm64 -Version $v -OutputDirectory packages -NonInteractive
          nuget install Microsoft.Windows.WDK.x64        -Version $v -OutputDirectory packages -NonInteractive
          Get-ChildItem packages | Select-Object Name

      - name: Build (cl/link direct, ARM64)
        shell: pwsh
        run: |
          .\build.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alioth-drivers-arm64
          path: stage/
